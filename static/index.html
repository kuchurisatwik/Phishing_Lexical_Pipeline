<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | URL Verification API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="shield-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <h1>Nexus<span>Verify</span></h1>
            </div>
            <p>Advanced Lexical & Machine Learning Phishing Detection</p>
        </header>

        <main>
            <div class="glass-card main-card">
                <form id="verify-form">
                    <div class="input-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                        <input type="url" id="url-input" placeholder="https://example.com" required autocomplete="off">
                        <button type="submit" id="verify-btn">
                            <span class="btn-text">Verify URL</span>
                            <div class="spinner hidden"></div>
                        </button>
                    </div>
                </form>
            </div>

            <div id="result-container" class="glass-card result-card hidden">
                <!-- Results will be injected here by app.js -->
            </div>
        </main>
        
        <footer>
            <p>Powered by the Advanced Agentic Phishing Lexical Pipeline</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
